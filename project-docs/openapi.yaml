openapi: 3.1.0
info:
  title: Multi-Provider Object Storage API
  version: 0.1.0
  description: |
    Initial contract for the implemented control-plane and custom storage API.
    This draft covers the organization membership and role administration
    vertical slice together with provider setup and storage clients.
    Organization management routes require a user JWT and the
    x-organization-id header. Platform routes require a global role with the
    platform permission and do not accept an organization header as scope.
    Storage routes require an API credential in the form keyId.secret and
    enforce namespace and folder-grant boundaries.
servers:
  - url: http://localhost:4000
    description: Local API
tags:
  - name: Health
  - name: Authentication
  - name: Organizations
  - name: Providers
  - name: Buckets
  - name: Namespaces
  - name: API credentials
  - name: Folder grants
  - name: Migrations
  - name: Platform
  - name: File Explorer
  - name: Storage
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /metrics:
    get:
      tags: [Health]
      operationId: metrics
      security: [{ metricsBearer: [] }]
      responses:
        '200':
          description: Prometheus metrics for the deployment.
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Metrics are disabled or the token is invalid.

  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      description: Sets rotated httpOnly refresh and CSRF cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token and public user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refresh
      description: Requires the refresh cookie and matching X-CSRF-Token header.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Rotated access and refresh session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      description: Revokes the refresh session and clears auth cookies.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session logged out.
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: session
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current public user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: getOrganization
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization summary.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations/{organizationId}/activity-logs:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: listActivityLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            pattern: '^\d{1,20}$'
        - name: limit
          in: query
          schema:
            type: string
            pattern: '^\d{1,3}$'
            default: '50'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 120
        - name: entityType
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Activity log page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/organizations/{organizationId}/usage:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: getOrganizationUsage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: string, pattern: '^\d{1,3}$', default: '50' }
      responses:
        '200':
          description: Organization usage totals and a bounded namespace page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/organizations/{organizationId}/usage/export:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: exportOrganizationUsage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: string, pattern: '^\d{1,3}$', default: '50' }
      responses:
        '200':
          description: Bounded CSV usage export. Continue with X-Next-Cursor when present.
          headers:
            X-Next-Cursor:
              schema: { type: string, format: uuid }
          content:
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization members and assigned role names.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Organizations]
      operationId: addOrganizationMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    patch:
      tags: [Organizations]
      operationId: updateMemberStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusUpdateRequest'
      responses:
        '200':
          description: Member status updated.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/organizations/{organizationId}/members/{membershipId}/roles:
    post:
      tags: [Organizations]
      operationId: assignMemberRole
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationIdPath'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Updated member role assignment.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/organizations/{organizationId}/roles:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Organizations]
      operationId: listOrganizationRoles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization roles and permission keys.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Organizations]
      operationId: createOrganizationRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: '#/components/schemas/Role' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organizationId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    patch:
      tags: [Organizations]
      operationId: updateOrganizationRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: '#/components/schemas/Role' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Organizations]
      operationId: deleteOrganizationRole
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Role deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Organization-scoped providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderConnection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Providers]
      operationId: createProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider:
                    $ref: '#/components/schemas/ProviderConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Providers]
      operationId: getProvider
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider summary.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider:
                    $ref: '#/components/schemas/ProviderConnection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Providers]
      operationId: updateProvider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider:
                    $ref: '#/components/schemas/ProviderConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Providers]
      operationId: deleteProvider
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Provider deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/providers/{providerId}/test:
    post:
      tags: [Providers]
      operationId: testProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bucketName:
                  type: string
                  minLength: 3
                  maxLength: 255
      responses:
        '200':
          description: Provider test succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'
  /v1/providers/{providerId}/buckets:
    get:
      tags: [Providers]
      operationId: discoverProviderBuckets
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Accessible bucket names.
          content:
            application/json:
              schema:
                type: object
                required: [bucketNames]
                properties:
                  bucketNames:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'

  /v1/buckets:
    get:
      tags: [Buckets]
      operationId: listBucketConnections
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Imported bucket connections.
          content:
            application/json:
              schema:
                type: object
                required: [buckets]
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketConnection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/buckets/import:
    post:
      tags: [Buckets]
      operationId: importBucket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketImportRequest'
      responses:
        '201':
          description: Bucket imported.
          content:
            application/json:
              schema:
                type: object
                required: [bucket]
                properties:
                  bucket:
                    $ref: '#/components/schemas/BucketConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderFailure'
  /v1/buckets/{bucketId}:
    parameters:
      - $ref: '#/components/parameters/BucketId'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Buckets]
      operationId: getBucketConnection
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bucket connection.
          content:
            application/json:
              schema:
                type: object
                required: [bucket]
                properties:
                  bucket:
                    $ref: '#/components/schemas/BucketConnection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Buckets]
      operationId: updateBucketStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
      responses:
        '200':
          description: Bucket status updated.
          content:
            application/json:
              schema:
                type: object
                required: [bucket]
                properties:
                  bucket:
                    $ref: '#/components/schemas/BucketConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Buckets]
      operationId: deleteBucketConnection
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Bucket connection deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/buckets/{bucketId}/objects:
    parameters:
      - $ref: '#/components/parameters/BucketId'
      - $ref: '#/components/parameters/OrganizationIdHeader'
    get:
      tags: [Buckets]
      operationId: listBucketObjects
      summary: List existing objects directly from an imported bucket.
      description: Read-only provider listing that does not require or populate a namespace.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: prefix
          in: query
          schema: { type: string, maxLength: 2048, default: '' }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 8192 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: One provider-backed page of folders and objects.
